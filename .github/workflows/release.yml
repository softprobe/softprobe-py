name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write # PyPI Trusted Publishing (OIDC)
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must match vX.Y.Z (got '$TAG')"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set package version and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # hatchling reads version from pyproject — bump for the release tag
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          text, n = re.subn(
              r'(?m)^version\s*=\s*"[^"]*"',
              f'version = "{version}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("failed to rewrite version in pyproject.toml")
          path.write_text(text)
          print(f"version -> {version}")
          PY
          uv build

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
