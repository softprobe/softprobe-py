[project]
name = "softprobe"
version = "0.1.0"
description = "Softprobe LLM observability SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Softprobe" }]
dependencies = [
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0",
  "opentelemetry-semantic-conventions>=0.51b0",
  "openai>=1.40.0",
]

[project.optional-dependencies]
openai = [
  "openai>=1.40.0",
]
langchain = [
  "langchain-core>=0.3.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "mypy>=1.14.0",
  "ruff>=0.9.0",
  "openai>=1.40.0",
  "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["softprobe"]
mypy_path = "src"

[project.urls]
Homepage = "https://docs.softprobe.ai/en/agent-qa/"
Documentation = "https://docs.softprobe.ai/en/agent-qa/langchain"
Repository = "https://github.com/softprobe/softprobe-py"
Issues = "https://github.com/softprobe/softprobe-py/issues"

